name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --locked --all-targets --verbose

      - name: Check documentation examples
        run: cargo test --locked --doc

  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build bind9 image
        run: docker build -t bind9-test ./docker

      - name: Start bind9 container
        run: docker run -d -p 127.0.0.1:953:953 --name bind9 bind9-test

      - name: Wait for bind9 (authenticated RNDC command)
        run: |
          for i in {1..10}; do
            if docker exec bind9 rndc -s 127.0.0.1 -k /etc/bind/rndc.key status; then
              echo "bind9 is ready"
              exit 0
            fi
            echo "waiting for bind9..."
            sleep 1
          done
          echo "bind9 did not start in time"
          exit 1

      - name: Run tests
        run: cargo test --locked --test rndc -- --ignored

      - name: Show bind9 logs on failure
        if: failure()
        run: docker logs bind9

      - name: Stop bind9 container
        if: always()
        run: |
          if docker container inspect bind9 > /dev/null 2>&1; then
            docker rm -f bind9
          fi
